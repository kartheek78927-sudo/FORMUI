<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="page-wrapper">
        <div class="form-container">
            <div class="header">
                <h1>Share Your Details</h1>
                <p>Fill out the form below to create your beautiful profile.</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <div class="flash-messages">
                  {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}
            <form action="{{ url_for('submit') }}" method="post" class="user-form">
                <div class="field-row">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Jane Doe" required>
                </div>
                <div class="field-row">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="jane@example.com" required>
                </div>
                <div class="field-row">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" required>
                </div>
                <div class="field-row">
                    <label for="address">Street Address</label>
                    <input type="text" id="address" name="address" placeholder="123 Main St" required>
                </div>
                <div class="field-row split-row">
                    <div>
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" placeholder="City" required>
                    </div>
                    <div>
                        <label for="state">State</label>
                        <input type="text" id="state" name="state" placeholder="State" required>
                    </div>
                </div>
                <div class="field-row split-row">
                    <div>
                        <label for="zip_code">ZIP Code</label>
                        <input type="text" id="zip_code" name="zip_code" placeholder="Postal Code" required>
                    </div>
                    <div>
                        <label for="country">Country</label>
                        <input type="text" id="country" name="country" placeholder="Country" required>
                    </div>
                </div>
                <div class="field-row">
                    <label for="birthdate">Birthdate</label>
                    <input type="date" id="birthdate" name="birthdate" required>
                </div>
                <div class="field-row">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Non-binary">Non-binary</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
                <div class="field-row">
                    <label for="occupation">Occupation</label>
                    <input type="text" id="occupation" name="occupation" placeholder="Your role" required>
                </div>
                <div class="field-row">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company" placeholder="Company name" required>
                </div>
                <div class="field-row">
                    <label for="website">Website</label>
                    <input type="url" id="website" name="website" placeholder="https://example.com" required>
                </div>
                <div class="field-row">
                    <label for="about">About You</label>
                    <textarea id="about" name="about" rows="4" placeholder="Tell us about yourself" required></textarea>
                </div>
                <button type="submit" class="submit-button">Submit Details</button>
            </form>
        </div>
    </div>
</body>
</html>
