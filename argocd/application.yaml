apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: formui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kartheek78927-sudo/FORMUI
    targetRevision: main
    path: formui-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: formui-helm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
